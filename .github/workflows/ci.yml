name: CI

# Roda a cada push na main e em todo Pull Request para a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SQLite e lcov (banco em memória dos testes e cobertura)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev lcov

      - name: Versão do Flutter
        run: flutter --version

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática do código
        run: flutter analyze --no-fatal-infos

      - name: Testes unitários, de widget e de integração (com cobertura)
        run: flutter test --coverage --reporter expanded

      - name: Resumo da cobertura de código
        run: lcov --summary coverage/lcov.info

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-lcov
          path: coverage/lcov.info

  build:
    name: Build do APK (Android)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta da plataforma Android
        run: flutter create --platforms=android --project-name luzido --org br.com.luzido .

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar o APK
        run: flutter build apk --debug

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: luzido-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
